spring.application.name=odds

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/odds_db
spring.datasource.username=unwire
spring.datasource.password=unwire
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Sofascore match discovery
# Sofascore withdrew /sport/{sport}/scheduled-events/{date}. Discovery now asks which tournaments
# play on a date, then pulls events for the ones we track.
# Pages of the day's tournament list to walk. A busy Saturday runs to 13 pages of 100, so 10 cut
# the list off partway through; the tail is minor competitions, but an all-leagues refresh lost it.
sofascore.discovery.tournament-list-max-pages=15
# Pages fetched per tournament per direction (upcoming/finished):
sofascore.discovery.max-pages=3
# Spacing between discovery requests; their Varnish edge IP-blocks bursts.
sofascore.discovery.request-delay-ms=250
# Leagues are seeded from previously stored matches, widened with Sofascore's top competitions
# for this country. That list is what populates an empty database - no league ids to maintain.
sofascore.discovery.default-tournaments-country=DK

# The list above is what Sofascore offers a Danish audience: the Danish tiers, the big five, the
# UEFA/FIFA competitions. Every other European top flight is missing from it, so pin those here.
# Entries are `id:Name` where id is the unique-tournament id (sofascore.com/tournament/... or
# /api/v1/unique-tournament/{id}); the name only shows up in logs. A name may not contain a comma.
# A pinned league counts as top even if it was first stored during an all-leagues refresh.
sofascore.discovery.extra-top-leagues.football=\
  7:UEFA Champions League,\
  679:UEFA Europa League,\
  17015:UEFA Conference League,\
  238:Liga Portugal Betclic,\
  37:Eredivisie,\
  38:Belgian Pro League,\
  36:Scottish Premiership,\
  52:Super Lig,\
  185:Greek Super League,\
  45:Austrian Bundesliga,\
  215:Swiss Super League
# Others verified against the API, add as needed: 20:Eliteserien, 40:Allsvenskan, 202:Ekstraklasa,
# 210:Serbian Superliga, 325:Brasileirao, 155:Liga Profesional, 242:MLS
sofascore.discovery.extra-top-leagues.handball=

# Logging
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.HttpLogging=INFO
logging.level.org.springframework.web.server.adapter=INFO
logging.level.jp.odds=DEBUG

# Claude integration
# Which backend answers /api/claude/ask: CLI shells out to the locally installed and logged-in
# Claude Code CLI (no API key, no credits); API calls the Anthropic API and needs ANTHROPIC_API_KEY
# exported before startup. This is only the starting point - the Ask Claude view toggles at runtime.
claude.provider=CLI
# Blank uses whatever model the CLI itself is set to. Pin it with e.g. opus, sonnet, claude-opus-5.
claude.cli.model=
claude.cli.executable=claude
claude.cli.timeout-seconds=180
# Used by the API provider only.
claude.api.model=claude-opus-5
claude.api.max-tokens=16000

# Team news for predictions
# Football predictions are given headlines from the news desks named in the skill document, so
# every prediction is built from the same sources in the same shape. Which feeds, how many
# headlines per team and how long they are cached all live in that document, not here:
prediction.team-news.skill=prediction/football-team-news.md
prediction.team-news.enabled=true
prediction.team-news.timeout-seconds=8
