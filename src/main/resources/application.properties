vaadin.launch-browser=true
spring.application.name=odds

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/odds_db
spring.datasource.username=unwire
spring.datasource.password=unwire
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Allowed leagues for import (Country:League), comma-separated.
